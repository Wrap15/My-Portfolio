<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Forest/Emerald Green gradient for the 3D body effect -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="35%" stop-color="#064e3b" />
      <stop offset="70%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    
    <!-- Lighter Minty-Emerald for metallic highlights/borders -->
    <linearGradient id="edgeGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Deep Drop Shadow & Inner Glow effects -->
    <filter id="luxury-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Clean, round container background for modern browser tabs -->
  <circle cx="256" cy="256" r="240" fill="#030712" />
  
  <!-- Outer border ring with luxurious highlight -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#edgeGradient)" stroke-width="4" opacity="0.3" />

  <!-- Monogram DP Group -->
  <g filter="url(#luxury-shadow)" transform="translate(15, 0)">
    <!-- Main stylized capital D path with sharp medieval horns -->
    <path d="M 140 110 
             C 180 110, 240 110, 280 120
             C 350 140, 410 190, 410 270
             C 410 350, 340 400, 270 410
             C 240 412, 190 412, 153 410
             C 170 395, 185 360, 185 320
             L 185 200
             C 185 160, 170 125, 140 110 Z" 
          fill="url(#bodyGradient)" 
          stroke="url(#edgeGradient)" 
          stroke-width="5" 
          stroke-linejoin="round" />
          
    <!-- Inner D negative space or cutaway to emphasize structure -->
    <path d="M 230 155
             C 255 155, 290 155, 320 180
             C 350 205, 360 240, 360 270
             C 360 300, 345 335, 315 355
             C 285 375, 250 375, 230 375
             Z" 
          fill="#030712" />

    <!-- Stem and loop of P, nesting elegantly inside D's bowl -->
    <path d="M 230 190
             L 230 400
             C 230 415, 215 425, 195 425
             L 265 425
             C 250 425, 241 415, 241 400
             L 241 315
             C 260 315, 290 315, 315 300
             C 340 285, 350 260, 350 238
             C 350 216, 335 195, 305 190
             C 280 188, 250 188, 230 190 Z" 
          fill="url(#bodyGradient)" 
          stroke="url(#edgeGradient)" 
          stroke-width="4.5" 
          stroke-linejoin="round" />

    <!-- Inner bowl of P -->
    <path d="M 268 220
             C 280 220, 295 220, 305 230
             C 315 240, 315 255, 312 265
             C 305 278, 285 285, 268 285
             Z" 
          fill="#030712" />
  </g>
</svg>
